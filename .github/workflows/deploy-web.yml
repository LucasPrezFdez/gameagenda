# Despliegue de `ga-web` (§12.5 de prototipe.md; CA0.1): tras un `ci` en verde de un *push* a
# `main`, o a mano desde `main`, construye el SHA que pasó el CI, busca la clave de Steam,
# despliega con `wrangler` y hace una prueba de humo. `workflow_run` se dispara sea cual sea el
# resultado del CI, también tras el de una PR: de ahí las condiciones del trabajo. Vuelta atrás:
# `npx wrangler rollback -c apps/web/wrangler.jsonc` (cada versión lleva su SHA como mensaje).
name: deploy-web

on:
  workflow_run:
    workflows: [ci]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# Un despliegue cada vez y en orden: nunca uno viejo encima de uno nuevo.
concurrency:
  group: deploy-web
  cancel-in-progress: false

env:
  # Carpeta del catálogo publicado (`ga-catalog`) para el *build*. Su origen tiene que estar en el
  # `connect-src` de `apps/web/public/_headers`: el paso «Cabeceras» lo comprueba. `ga-catalog` va
  # en su propia cuenta de Cloudflare (subdominio `gameagenda-cat.workers.dev`, §11.3); el CORS de
  # `pipeline/catalog.headers` da paso a `ga-web`, en `gameagenda.workers.dev`.
  VITE_CATALOG_URL: https://ga-catalog.gameagenda-cat.workers.dev/
  WRANGLER_SEND_METRICS: "false"

jobs:
  deploy:
    name: Despliega ga-web
    if: >-
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') ||
      (github.event_name == 'workflow_run' &&
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Con `workflow_run`, `GITHUB_SHA` es el último *commit* de `main`, no el que pasó el CI.
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Búsqueda de la clave de Steam en el build
        run: node scripts/scan-secrets.ts apps/web/dist
        env:
          STEAM_KEY_SHA256: ${{ vars.STEAM_KEY_SHA256 }}
      - name: Cabeceras (catálogo en connect-src, sin unsafe-inline)
        run: |
          headers=apps/web/dist/_headers
          origin=$(node -p 'new URL(process.env.VITE_CATALOG_URL).origin')
          if ! grep -qF "connect-src 'self' $origin;" "$headers"; then
            echo "::error::La CSP de $headers no permite $origin en connect-src"
            exit 1
          fi
          if grep -qi "unsafe-inline" "$headers"; then
            echo "::error::La CSP de $headers lleva unsafe-inline"
            exit 1
          fi
      - name: Despliega con wrangler
        id: deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          WRANGLER_OUTPUT_FILE_PATH: ${{ runner.temp }}/wrangler-output.json
          SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
        run: |
          npx wrangler deploy -c apps/web/wrangler.jsonc --message "$SHA"
          url=$(jq -r 'select(.type == "deploy") | .targets[]? | select(endswith(".workers.dev"))' "$WRANGLER_OUTPUT_FILE_PATH" | head -n 1)
          if [ -z "$url" ]; then
            echo "::error::wrangler no ha devuelto la URL de workers.dev"
            exit 1
          fi
          echo "url=$url" >> "$GITHUB_OUTPUT"
      - name: Prueba de humo (200, index.html y la CSP de _headers)
        env:
          URL: ${{ steps.deploy.outputs.url }}
        run: |
          header() { grep -i "^$1:" "$2" | tail -n 1 | cut -d' ' -f2- || true; }
          expected=$(sed -n 's/^  Content-Security-Policy: //p' apps/web/dist/_headers)
          # Un Worker recién creado puede tardar unos segundos en responder.
          curl -sS --fail --retry 10 --retry-all-errors --retry-delay 3 -o /dev/null "$URL/"
          # `/juego/steam:730` es un enlace profundo: el *fallback* de la SPA da `index.html`
          # (antes, Workers Static Assets redirige con 307 a `/juego/steam%3A730`).
          for path in / /juego/steam:730; do
            code=$(curl -sS -L -D raw.txt -o body.html -w '%{http_code}' "$URL$path")
            tr -d '\r' < raw.txt > headers.txt
            csp=$(header content-security-policy headers.txt)
            echo "$path → $code"
            echo "  Content-Security-Policy: $csp"
            if [ "$code" != 200 ]; then echo "::error::$path responde $code"; exit 1; fi
            if [ "$csp" != "$expected" ]; then echo "::error::$path no envía la CSP de _headers"; exit 1; fi
            if ! cmp -s body.html apps/web/dist/index.html; then echo "::error::$path no sirve index.html"; exit 1; fi
          done
          echo "✓ $URL responde con la CSP de _headers" >> "$GITHUB_STEP_SUMMARY"
