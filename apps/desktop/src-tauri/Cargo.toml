# App de escritorio de GameAgenda (§17.3 de prototipe.md; ADR-010): envoltorio Tauri de `ga-web`.
# Versiones exactas con `=` (§6.1 y §6.5); `Cargo.lock` se versiona. El CI no compila Rust (§12.5).
[package]
name = "gameagenda-desktop"
version = "0.2.0"
description = "App de escritorio de GameAgenda para Windows: envoltorio Tauri de ga-web con atajo global"
edition = "2024"
rust-version = "1.90"
publish = false

[build-dependencies]
tauri-build = { version = "=2.7.4", features = [] }

[dependencies]
tauri = { version = "=2.12.5", features = ["tray-icon"] }
tauri-plugin-autostart = "=2.7.0"
tauri-plugin-global-shortcut = "=2.4.1"
tauri-plugin-single-instance = "=2.5.5"

# La misma versión que usa `tauri`: solo añade `ShellExecuteW` (enlaces externos en el navegador
# del sistema) y `GetForegroundWindow` (¿está la ventana delante?), sin otro *crate*.
[target.'cfg(windows)'.dependencies]
windows = { version = "=0.62.2", features = [
  "Win32_Foundation",
  "Win32_UI_Shell",
  "Win32_UI_WindowsAndMessaging",
] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
